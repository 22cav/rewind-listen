# Lint and tests on Apple Silicon (MLX needs macOS). Documentation-only changes and [skip ci] commits do not run it.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m pytest -q
